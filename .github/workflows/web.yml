# Veröffentlicht die Web-App auf GitHub Pages (iPhone: in Safari öffnen -> Teilen -> „Zum Home-Bildschirm“).
# Vorher einmalig: Repository -> Settings -> Pages -> Source: „GitHub Actions“. Dann hier unter Actions manuell starten.
name: Web-App veröffentlichen

on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: www
      - id: deployment
        uses: actions/deploy-pages@v4
